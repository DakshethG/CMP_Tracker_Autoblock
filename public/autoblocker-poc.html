<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Privado Autoblocker POC</title>
  <!-- POC_BLOCKER -->
  <script>
    window.__poc = {
      run: '__POC_RUN__', mode: '__POC_MODE__', executed: {}, resourceRequests: new Set(), notes: [],
      markExecuted(pattern) { this.executed[pattern] = (this.executed[pattern] || 0) + 1; render(); },
      note(text) { this.notes.push(text); render(); }
    };
    document.cookie = 'poc_tracker_cookie=; Max-Age=0; Path=/; SameSite=Lax';
    localStorage.removeItem('poc_tracker_storage');

    const rows = [
      ['script-normal', 'Normal external script', 'ga-normal.js', 'script'],
      ['script-async', 'Async external script', 'ga-async.js', 'script'],
      ['script-defer', 'Defer external script', 'ga-defer.js', 'script'],
      ['dropping-cookie', 'Cookie/storage tracker', 'droppingcookie.js', 'script'],
      ['gtm-inline', 'Inline GTM-style loader', 'inline snippet', 'inline'],
      ['gtm-child', 'GTM child script', 'gtm-child.js', 'script'],
      ['meta-inline', 'Inline Meta-style loader', 'inline snippet', 'inline'],
      ['meta-child', 'Meta child script', 'meta-child.js', 'script'],
      ['image-html', 'HTML image pixel', 'image-pixel.gif', 'resource'],
      ['iframe-html', 'HTML iframe', 'tracker-iframe.html', 'resource'],
      ['preload', 'Preload resource hint', 'preload-target.js', 'resource'],
      ['prefetch', 'Prefetch resource hint', 'prefetch-target.js', 'resource'],
      ['dynamic-script', 'Dynamic script', 'dynamic-tracker.js', 'script'],
      ['dynamic-image', 'Dynamic image', 'dynamic-pixel.gif', 'resource'],
      ['fetch', 'fetch()', 'fetch', 'resource'], ['xhr', 'XHR', 'xhr', 'resource'], ['beacon', 'sendBeacon()', 'beacon', 'resource']
    ];
    function trackerFromUrl(value) {
      const url = new URL(value, location.href);
      const filenames = {
        'ga-normal.js': 'script-normal', 'ga-async.js': 'script-async', 'ga-defer.js': 'script-defer',
        'droppingcookie.js': 'dropping-cookie', 'gtm-child.js': 'gtm-child', 'meta-child.js': 'meta-child',
        'image-pixel.gif': 'image-html', 'tracker-iframe.html': 'iframe-html',
        'preload-target.js': 'preload', 'prefetch-target.js': 'prefetch',
        'dynamic-tracker.js': 'dynamic-script', 'dynamic-pixel.gif': 'dynamic-image'
      };
      return url.searchParams.get('pattern') || filenames[url.pathname.split('/').pop()] || null;
    }
    new PerformanceObserver(list => {
      list.getEntries().forEach(entry => { const pattern = trackerFromUrl(entry.name); if (pattern) window.__poc.resourceRequests.add(pattern); });
      render();
    }).observe({ type: 'resource', buffered: true });
    function requested(pattern, kind) { return kind === 'inline' ? 'N/A — inline code' : window.__poc.resourceRequests.has(pattern) ? 'Yes' : 'No'; }
    function ran(pattern, kind) { return kind === 'resource' ? 'N/A' : window.__poc.executed[pattern] ? 'Yes' : 'No'; }
    function verdict(pattern, kind) {
      const wasRequested = window.__poc.resourceRequests.has(pattern);
      const didRun = Boolean(window.__poc.executed[pattern]);
      if (window.__poc.mode === 'baseline') return didRun || wasRequested ? 'Control: fired as expected' : 'Control: not observed';
      if (kind === 'inline') return didRun ? 'Fail: inline code ran' : 'Pass: inline code held';
      if (kind === 'resource') return wasRequested ? 'Fail: request escaped' : 'Pass: no request observed';
      if (wasRequested && didRun) return 'Fail: request and execution escaped';
      if (wasRequested) return 'Fail: request escaped; execution prevented';
      return didRun ? 'Fail: execution escaped' : 'Pass: no request or execution observed';
    }
    function evidence(pattern, filename, kind) {
      const details = [kind === 'inline'
        ? (window.__poc.executed[pattern] ? 'Inline execution marker present' : 'Inline execution marker absent')
        : (window.__poc.resourceRequests.has(pattern) ? `Network: ${filename}` : `No resource timing entry for ${filename}`)];
      if (kind === 'script') details.push(window.__poc.executed[pattern] ? 'execution marker present' : 'execution marker absent');
      if (pattern === 'dropping-cookie') details.push(document.cookie.includes('poc_tracker_cookie=1') && localStorage.getItem('poc_tracker_storage') === '1' ? 'cookie + localStorage written' : 'no controlled storage observed');
      return details.join('; ');
    }
    function render() {
      const target = document.getElementById('results'); if (!target) return;
      target.replaceChildren();
      const displayMode = window.__poc.mode === 'baseline' ? 'Baseline — no blocker' : `Blocked — ${new URL(location.href).searchParams.get('delay') || '0'} ms`;
      rows.forEach(([pattern, label, filename, kind]) => {
        const row = document.createElement('tr');
        [label, displayMode, requested(pattern, kind), ran(pattern, kind), verdict(pattern, kind), evidence(pattern, filename, kind)].forEach(value => {
          const cell = document.createElement('td'); cell.textContent = value; row.appendChild(cell);
        }); target.appendChild(row);
      });
      document.getElementById('run-meta').textContent = `Mode: ${window.__poc.mode}; run: ${window.__poc.run}. Reload for a fresh single-fire run.`;
      document.getElementById('audit').textContent = [...(window.__pocAudit || []), ...window.__poc.notes].join('\n') || 'No blocker audit in baseline mode.';
    }
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('[data-mode]').forEach(button => button.addEventListener('click', () => {
        const next = new URL(location.href); next.searchParams.set('mode', button.dataset.mode); next.searchParams.set('run', `${button.dataset.mode}-${Date.now()}`);
        if (button.dataset.delay) next.searchParams.set('delay', button.dataset.delay); else next.searchParams.delete('delay'); location.assign(next);
      }));
      setTimeout(() => {
        const run = encodeURIComponent(window.__poc.run);
        const script = document.createElement('script'); script.dataset.pocTracker = 'dynamic-script'; script.src = `/poc-assets/dynamic-tracker.js?run=${run}&pattern=dynamic-script`; document.body.appendChild(script);
        const image = new Image(1, 1); image.dataset.pocTracker = 'dynamic-image'; image.src = `/poc-assets/dynamic-pixel.gif?run=${run}&pattern=dynamic-image`; document.body.appendChild(image);
        fetch(`/poc-api/fetch?run=${run}&pattern=fetch`).catch(() => {});
        try { const xhr = new XMLHttpRequest(); xhr.open('GET', `/poc-api/xhr?run=${run}&pattern=xhr`); xhr.send(); } catch (_) {}
        navigator.sendBeacon?.(`/poc-api/beacon?run=${run}&pattern=beacon`, 'poc');
      }, 100);
      [300, 1000, 1800].forEach(wait => setTimeout(render, wait)); render();
    });
  </script>
  <script data-poc-tracker="script-normal" src="/poc-assets/ga-normal.js?run=__POC_RUN__"></script>
  <script async data-poc-tracker="script-async" src="/poc-assets/ga-async.js?run=__POC_RUN__"></script>
  <script defer data-poc-tracker="script-defer" src="/poc-assets/ga-defer.js?run=__POC_RUN__"></script>
  <script data-poc-tracker="dropping-cookie" src="/poc-assets/droppingcookie.js?run=__POC_RUN__"></script>
  <link data-poc-tracker="preload" rel="preload" as="script" href="/poc-assets/preload-target.js?run=__POC_RUN__">
  <link data-poc-tracker="prefetch" rel="prefetch" href="/poc-assets/prefetch-target.js?run=__POC_RUN__">
  <script data-poc-tracker="gtm-inline">window.__poc.markExecuted('gtm-inline'); const gtm = document.createElement('script'); gtm.dataset.pocTracker = 'gtm-child'; gtm.src = '/poc-assets/gtm-child.js?run=__POC_RUN__'; document.head.appendChild(gtm);</script>
  <script data-poc-tracker="meta-inline">window.__poc.markExecuted('meta-inline'); const meta = document.createElement('script'); meta.dataset.pocTracker = 'meta-child'; meta.src = '/poc-assets/meta-child.js?run=__POC_RUN__'; document.head.appendChild(meta);</script>
  <style>
    body { font: 16px/1.45 system-ui, sans-serif; margin: 32px auto; max-width: 1250px; padding: 0 20px; color: #17212b; }
    h1 { margin-bottom: 4px; } .muted { color: #54616f; } button { margin: 0 8px 10px 0; padding: 8px 12px; }
    table { border-collapse: collapse; width: 100%; margin: 16px 0; } th, td { border: 1px solid #cbd5df; padding: 8px; text-align: left; vertical-align: top; } th { background: #edf3f7; } pre { background: #17212b; color: #d9e4ec; padding: 12px; overflow: auto; }
  </style>
</head>
<body>
  <h1>Privado Autoblocker POC</h1>
  <p class="muted">Each controlled pattern fires once per page load. The browser Network panel is the authoritative request evidence; this table pairs it with execution and side-effect evidence.</p>
  <p><button data-mode="baseline">Baseline — no blocker</button><button data-mode="blocked">Blocked — 0 ms</button><button data-mode="blocked" data-delay="800">Blocked — 800 ms</button></p>
  <p id="run-meta">Loading…</p>
  <table><thead><tr><th>Pattern</th><th>Mode</th><th>Requested before consent?</th><th>Ran before consent?</th><th>Verdict</th><th>Evidence</th></tr></thead><tbody id="results"></tbody></table>
  <details><summary>Blocker audit</summary><pre id="audit"></pre></details>
  <img data-poc-tracker="image-html" src="/poc-assets/image-pixel.gif?run=__POC_RUN__" width="1" height="1" alt="">
  <noscript><img src="/poc-assets/noscript-pixel.gif?run=__POC_RUN__" width="1" height="1" alt=""></noscript>
  <iframe data-poc-tracker="iframe-html" title="Controlled tracker frame" src="/poc-assets/tracker-iframe.html?run=__POC_RUN__"></iframe>
</body>
</html>
